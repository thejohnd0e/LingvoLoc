name: Windows checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - name: Fetch PDFium runtime
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1
      - run: npm run check
